$kind: http-request
url: "{{baseUrl}}/login"
method: POST
body:
  type: urlencoded
  content:
    _token: "{{csrf_token}}"
    email: "{{testEmail}}"
    password: "{{testPassword}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 302\", () => pm.response.to.have.status(302));\r

      pm.test(\"Không quay lại trang login\", () => pm.expect(pm.response.headers.get(\"Location\")).to.not.include(\"/login\"));"
    language: text/javascript
settings:
  followRedirects: false
order: 3000
