$kind: http-request
url: "{{baseUrl}}/cart"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Thời gian < 3000ms\", () => pm.expect(pm.response.responseTime).to.be.below(3000));\r

      pm.test(\"Trả về HTML\", () => pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"text/html\"));\r

      pm.test(\"Giỏ có Váy len basic\", () => pm.expect(pm.response.text()).to.include(\"Váy len basic\"));"
    language: text/javascript
order: 1000
